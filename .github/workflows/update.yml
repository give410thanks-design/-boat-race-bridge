name: BOAT RACE Bridge Test

on:
  workflow_dispatch:
    inputs:
      venue:
        description: "場名"
        required: true
        default: "唐津"
      race_no:
        description: "レース番号"
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: CSV実データ診断
        env:
          VENUE: ${{ github.event.inputs.venue }}
          RACE_NO: ${{ github.event.inputs.race_no }}
        run: |
          python - <<'PY'
          import csv
          import urllib.request
          import os
          import json
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          date_path = now.strftime("%Y/%m/%d")
          date_value = now.strftime("%Y-%m-%d")

          venues = {
              "桐生": "01",
              "戸田": "02",
              "江戸川": "03",
              "平和島": "04",
              "多摩川": "05",
              "浜名湖": "06",
              "蒲郡": "07",
              "常滑": "08",
              "津": "09",
              "三国": "10",
              "びわこ": "11",
              "住之江": "12",
              "尼崎": "13",
              "鳴門": "14",
              "丸亀": "15",
              "児島": "16",
              "宮島": "17",
              "徳山": "18",
              "下関": "19",
              "若松": "20",
              "芦屋": "21",
              "福岡": "22",
              "唐津": "23",
              "大村": "24"
          }

          sources = {
              "tkz": "展示タイム",
              "stt": "スタート展示",
              "sui": "天候・水面",
              "od3": "3連単オッズ"
          }

          venue = os.environ.get("VENUE", "").strip()
          race_no = os.environ.get("RACE_NO", "").strip()

          venue_code = venues.get(venue)

          if venue_code is None:
              raise SystemExit("場名が認識できません: " + venue)

          try:
              race_number = int(race_no)
          except ValueError:
              raise SystemExit("レース番号が不正です")

          if race_number < 1 or race_number > 12:
              raise SystemExit("レース番号は1〜12で指定してください")

          target_code = (
              date_value.replace("-", "")
              + venue_code
              + f"{race_number:02d}"
          )

          print("========================================")
          print("BOAT RACE BRIDGE 診断")
          print("========================================")
          print("取得時刻:", now.isoformat())
          print("開催日:", date_value)
          print("場:", venue)
          print("場コード:", venue_code)
          print("R:", race_number)
          print("レースコード:", target_code)
          print("========================================")

          result = {
              "race": {
                  "date": date_value,
                  "venue": venue,
                  "venue_code": venue_code,
                  "race_no": race_number,
                  "race_code": target_code
              },
              "sources": {}
          }

          def get_row(source):

              url = (
                  "https://boatracecsv.github.io/data/previews/"
                  + source
                  + "/"
                  + date_path
                  + ".csv"
              )

              try:

                  with urllib.request.urlopen(
                      url,
                      timeout=30
                  ) as response:

                      text = response.read().decode(
                          "utf-8-sig"
                      )

                  reader = csv.DictReader(
                      text.splitlines()
                  )

                  rows = list(reader)

                  for row in rows:

                      code = (
                          row.get("レースコード")
                          or ""
                      ).strip()

                      if code == target_code:
                          return row, len(rows), None

                  return None, len(rows), None

              except Exception as e:

                  return None, 0, (
                      type(e).__name__
                      + ": "
                      + str(e)
                  )

          # ----------------------------------------
          # 展示タイム
          # ----------------------------------------

          row, total, error = get_row("tkz")

          tkz = {
              "available": row is not None,
              "csv_rows": total
          }

          if error:
              tkz["error"] = error

          if row:

              tkz["boats"] = {}

              for n in range(1, 7):

                  tkz["boats"][str(n)] = {
                      "weight": row.get(
                          f"艇{n}_体重(kg)"
                      ),
                      "weight_adjust": row.get(
                          f"艇{n}_体重調整(kg)"
                      ),
                      "exhibition_time": row.get(
                          f"艇{n}_展示タイム"
                      ),
                      "tilt": row.get(
                          f"艇{n}_チルト"
                      )
                  }

          result["sources"]["tkz"] = tkz

          # ----------------------------------------
          # スタート展示
          # ----------------------------------------

          row, total, error = get_row("stt")

          stt = {
              "available": row is not None,
              "csv_rows": total
          }

          if error:
              stt["error"] = error

          if row:

              stt["boats"] = {}

              for n in range(1, 7):

                  stt["boats"][str(n)] = {
                      "course": row.get(
                          f"艇{n}_コース"
                      ),
                      "start_exhibition": row.get(
                          f"艇{n}_スタート展示"
                      )
                  }

          result["sources"]["stt"] = stt

          # ----------------------------------------
          # 天候・水面
          # ----------------------------------------

          row, total, error = get_row("sui")

          sui = {
              "available": row is not None,
              "csv_rows": total
          }

          if error:
              sui["error"] = error

          if row:

              # レース識別情報以外を取得
              data = {}

              for key, value in row.items():

                  if key in (
                      "レースコード",
                      "レース日",
                      "レース場",
                      "レース回"
                  ):
                      continue

                  if value is not None and str(value).strip() != "":
                      data[key] = value

              sui["data"] = data

          result["sources"]["sui"] = sui

          # ----------------------------------------
          # 3連単オッズ
          # ----------------------------------------

          row, total, error = get_row("od3")

          od3 = {
              "available": row is not None,
              "csv_rows": total
          }

          if error:
              od3["error"] = error

          if row:

              data = {}

              for key, value in row.items():

                  if key in (
                      "レースコード",
                      "レース日",
                      "レース場",
                      "レース回"
                  ):
                      continue

                  if value is not None and str(value).strip() != "":
                      data[key] = value

              od3["data"] = data

          result["sources"]["od3"] = od3

          # ----------------------------------------
          # 簡易サマリー作成
          # ----------------------------------------

          summary = {
              "exhibition_time": {},
              "start_exhibition": {},
              "fastest_exhibition": None,
              "fastest_start": None
          }

          if tkz.get("available"):

              times = []

              for boat, data in tkz["boats"].items():

                  value = data.get("exhibition_time")

                  if value not in (
                      None,
                      "",
                      "-"
                  ):

                      try:
                          times.append(
                              (
                                  boat,
                                  float(value)
                              )
                          )
                      except ValueError:
                          pass

                  summary["exhibition_time"][boat] = value

              if times:

                  times.sort(key=lambda x: x[1])

                  summary["fastest_exhibition"] = {
                      "boat": times[0][0],
                      "time": times[0][1]
                  }

          if stt.get("available"):

              starts = []

              for boat, data in stt["boats"].items():

                  value = data.get(
                      "start_exhibition"
                  )

                  summary["start_exhibition"][boat] = value

                  if value not in (
                      None,
                      "",
                      "-"
                  ):

                      try:
                          starts.append(
                              (
                                  boat,
                                  float(value)
                              )
                          )
                      except ValueError:
                          pass

              if starts:

                  # STは数値が小さいほど速い
                  starts.sort(key=lambda x: x[1])

                  summary["fastest_start"] = {
                      "boat": starts[0][0],
                      "start": starts[0][1]
                  }

          result["summary"] = summary

          # ----------------------------------------
          # 最終出力
          # ----------------------------------------

          print("")
          print("========================================")
          print("【取得状況】")
          print("========================================")

          for source, label in sources.items():

              available = result["sources"][source].get(
                  "available",
                  False
              )

              print(
                  label + ":",
                  "取得成功" if available else "取得できず"
              )

          print("")
          print("========================================")
          print("【展示タイム】")
          print("========================================")

          for boat, value in summary["exhibition_time"].items():
              print(
                  f"{boat}号艇:",
                  value
              )

          if summary["fastest_exhibition"]:

              print(
                  "展示タイム最速:",
                  summary["fastest_exhibition"]["boat"]
                  + "号艇",
                  summary["fastest_exhibition"]["time"]
              )

          print("")
          print("========================================")
          print("【スタート展示】")
          print("========================================")

          for boat, value in summary["start_exhibition"].items():
              print(
                  f"{boat}号艇:",
                  value
              )

          if summary["fastest_start"]:

              print(
                  "ST展示最速:",
                  summary["fastest_start"]["boat"]
                  + "号艇",
                  summary["fastest_start"]["start"]
              )

          print("")
          print("========================================")
          print("【予想用JSON】")
          print("========================================")

          print(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  separators=(",", ":")
              )
          )

          print("")
          print("========================================")
          print("診断終了")
          print("========================================")

          PY