name: BOAT RACE Bridge Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get today's BOAT RACE preview data
        run: |
          python - <<'PY'
          import csv
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          date_path = now.strftime("%Y/%m/%d")
          date_value = now.strftime("%Y-%m-%d")

          sources = {
              "tkz": "exhibition_time",
              "stt": "start_exhibition",
              "sui": "weather",
              "od3": "odds_3tan",
          }

          result = {
              "generated_at": now.isoformat(),
              "date": date_value,
              "source": "BoatraceCSV",
              "races": {},
              "errors": {}
          }

          for source, name in sources.items():
              url = (
                  "https://boatracecsv.github.io/data/previews/"
                  + source + "/" + date_path + ".csv"
              )

              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      text = response.read().decode("utf-8-sig")

                  reader = csv.DictReader(text.splitlines())

                  for row in reader:
                      if row.get("レース日") != date_value:
                          continue

                      race_code = row.get("レースコード")

                      if not race_code:
                          continue

                      if race_code not in result["races"]:
                          result["races"][race_code] = {}

                      result["races"][race_code][name] = row

              except Exception as e:
                  result["errors"][source] = str(e)

          Path("latest.json").write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("取得完了")
          print("レース数:", len(result["races"]))
          print("エラー:", result["errors"])
          PY

      - name: Save latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update BOAT RACE preview data"
            git push
          fi
