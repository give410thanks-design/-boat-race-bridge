name: BOAT RACE Bridge Test

on:
  workflow_dispatch:
    inputs:
      venue:
        description: "場名"
        required: true
        default: "芦屋"
      race_no:
        description: "レース番号"
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: CSV実データ診断
        env:
          VENUE: ${{ github.event.inputs.venue }}
          RACE_NO: ${{ github.event.inputs.race_no }}
        run: |
          python - <<'PY'
          import csv
          import urllib.request
          import os
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          date_path = now.strftime("%Y/%m/%d")
          date_value = now.strftime("%Y-%m-%d")

          venues = {
              "桐生": "01",
              "戸田": "02",
              "江戸川": "03",
              "平和島": "04",
              "多摩川": "05",
              "浜名湖": "06",
              "蒲郡": "07",
              "常滑": "08",
              "津": "09",
              "三国": "10",
              "びわこ": "11",
              "住之江": "12",
              "尼崎": "13",
              "鳴門": "14",
              "丸亀": "15",
              "児島": "16",
              "宮島": "17",
              "徳山": "18",
              "下関": "19",
              "若松": "20",
              "芦屋": "21",
              "福岡": "22",
              "唐津": "23",
              "大村": "24"
          }

          sources = {
              "tkz": "展示タイム",
              "stt": "スタート展示",
              "sui": "天候・水面",
              "od3": "3連単オッズ"
          }

          venue = os.environ.get("VENUE", "").strip()
          race_no = os.environ.get("RACE_NO", "").strip()

          venue_code = venues.get(venue)

          if venue_code is None:
              raise SystemExit("場名が認識できません: " + venue)

          try:
              race_number = int(race_no)
          except ValueError:
              raise SystemExit("レース番号が不正です")

          target_code = (
              date_value.replace("-", "")
              + venue_code
              + f"{race_number:02d}"
          )

          print("========================================")
          print("BOAT RACE CSV 実データ診断")
          print("========================================")
          print("取得時刻:", now.isoformat())
          print("開催日:", date_value)
          print("場:", venue)
          print("場コード:", venue_code)
          print("R:", race_number)
          print("探すレースコード:", target_code)
          print("========================================")

          for source, label in sources.items():

              url = (
                  "https://boatracecsv.github.io/data/previews/"
                  + source
                  + "/"
                  + date_path
                  + ".csv"
              )

              print("")
              print("########################################")
              print(source, " / ", label)
              print("########################################")
              print("URL:", url)

              try:

                  with urllib.request.urlopen(
                      url,
                      timeout=30
                  ) as response:

                      text = response.read().decode(
                          "utf-8-sig"
                      )

                  reader = csv.DictReader(
                      text.splitlines()
                  )

                  rows = list(reader)

                  print("CSV総行数:", len(rows))

                  matches = []

                  for row in rows:

                      code = (
                          row.get("レースコード")
                          or ""
                      ).strip()

                      if code == target_code:
                          matches.append(row)

                  print("対象レース一致行数:", len(matches))

                  if len(matches) == 0:

                      print("")
                      print("【対象行なし】")
                      print("レースコード一覧:")

                      for row in rows:

                          print(
                              " ",
                              row.get("レースコード")
                          )

                      continue

                  print("")
                  print("========== 対象行 ==========")

                  row = matches[0]

                  print("列数:", len(row))

                  print("")
                  print("【列名】")

                  for key in row.keys():

                      print(" ", repr(key))

                  print("")
                  print("【値】")

                  for key, value in row.items():

                      print(
                          " ",
                          repr(key),
                          "=",
                          repr(value)
                      )

                  print("")
                  print("========== 対象行終了 ==========")

              except Exception as e:

                  print("")
                  print("【取得エラー】")
                  print(type(e).__name__)
                  print(repr(e))

          print("")
          print("========================================")
          print("診断終了")
          print("========================================")

          PY