name: BOAT RACE Bridge Test

on:
  workflow_dispatch:
    inputs:
      venue:
        description: "場名（例：蒲郡、下関、丸亀）"
        required: true
        default: "蒲郡"
      race_no:
        description: "レース番号（例：6）"
        required: true
        default: "6"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get BOAT RACE preview data
        env:
          VENUE: ${{ github.event.inputs.venue }}
          RACE_NO: ${{ github.event.inputs.race_no }}
        run: |
          python - <<'PY'
          import csv
          import json
          import urllib.request
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          date_path = now.strftime("%Y/%m/%d")
          date_value = now.strftime("%Y-%m-%d")

          # BOAT RACE 場コード
          venues = {
              "桐生": "01",
              "戸田": "02",
              "江戸川": "03",
              "平和島": "04",
              "多摩川": "05",
              "浜名湖": "06",
              "蒲郡": "07",
              "常滑": "08",
              "津": "09",
              "三国": "10",
              "びわこ": "11",
              "住之江": "12",
              "尼崎": "13",
              "鳴門": "14",
              "丸亀": "15",
              "児島": "16",
              "宮島": "17",
              "徳山": "18",
              "下関": "19",
              "若松": "20",
              "芦屋": "21",
              "福岡": "22",
              "唐津": "23",
              "大村": "24"
          }

          sources = {
              "tkz": "exhibition_time",
              "stt": "start_exhibition",
              "sui": "weather",
              "od3": "odds_3tan",
          }

          result = {
              "generated_at": now.isoformat(),
              "date": date_value,
              "source": "BoatraceCSV",
              "races": {},
              "errors": {}
          }

          status = {
              "generated_at": now.isoformat(),
              "date": date_value,
              "sources": {},
              "total_races": 0
          }

          # 全レースデータを取得
          for source, name in sources.items():

              url = (
                  "https://boatracecsv.github.io/data/previews/"
                  + source + "/" + date_path + ".csv"
              )

              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      text = response.read().decode("utf-8-sig")

                  rows = list(csv.DictReader(text.splitlines()))

                  valid_rows = 0

                  for row in rows:

                      if row.get("レース日") != date_value:
                          continue

                      race_code = row.get("レースコード")

                      if not race_code:
                          continue

                      valid_rows += 1

                      if race_code not in result["races"]:
                          result["races"][race_code] = {}

                      result["races"][race_code][name] = row

                  status["sources"][source] = {
                      "name": name,
                      "url": url,
                      "downloaded": True,
                      "rows": len(rows),
                      "today_rows": valid_rows
                  }

              except Exception as e:

                  result["errors"][source] = str(e)

                  status["sources"][source] = {
                      "name": name,
                      "url": url,
                      "downloaded": False,
                      "error": str(e)
                  }

          status["total_races"] = len(result["races"])

          # ------------------------------------------------
          # 指定レースを作成
          # ------------------------------------------------

          venue = os.environ.get("VENUE", "").strip()
          race_no = os.environ.get("RACE_NO", "").strip()

          target = {
              "generated_at": now.isoformat(),
              "date": date_value,
              "venue": venue,
              "race_no": race_no,
              "race_code": None,
              "exists": False,
              "data": {},
              "error": None
          }

          # 手動実行の場合だけ指定レースを作る
          if venue and race_no:

              venue_code = venues.get(venue)

              if venue_code is None:
                  target["error"] = "場名が認識できません: " + venue

              else:
                  try:
                      race_number = int(race_no)

                      if race_number < 1 or race_number > 12:
                          raise ValueError

                      race_code = (
                          date_value.replace("-", "")
                          + venue_code
                          + f"{race_number:02d}"
                      )

                      target["race_code"] = race_code

                      if race_code in result["races"]:
                          target["exists"] = True
                          target["data"] = result["races"][race_code]
                      else:
                          target["error"] = "指定レースのデータがありません"

                  except ValueError:
                      target["error"] = "レース番号は1〜12で指定してください"

          # ファイル保存
          Path("latest.json").write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path("status.json").write_text(
              json.dumps(
                  status,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path("target.json").write_text(
              json.dumps(
                  target,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("================================")
          print("BOAT RACE Bridge")
          print("取得時刻:", now.isoformat())
          print("総レース数:", len(result["races"]))
          print("指定場:", venue)
          print("指定R:", race_no)
          print("レースコード:", target["race_code"])
          print("指定レース存在:", target["exists"])
          print("エラー:", target["error"])
          print("================================")

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json status.json target.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update BOAT RACE data"
            git push
          fi