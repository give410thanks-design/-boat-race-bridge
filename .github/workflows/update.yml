name: BOAT RACE Bridge Test

on:
  workflow_dispatch:
    inputs:
      venue:
        description: "場名（例：蒲郡、下関、丸亀）"
        required: true
        default: "芦屋"

      race_no:
        description: "レース番号（例：6）"
        required: true
        default: "4"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose BOAT RACE CSV
        env:
          VENUE: ${{ github.event.inputs.venue }}
          RACE_NO: ${{ github.event.inputs.race_no }}

        run: |

          python - <<'PY'

          import csv
          import urllib.request
          import os

          from datetime import datetime, timezone, timedelta


          # ==================================================
          # 日本時間
          # ==================================================

          JST = timezone(timedelta(hours=9))

          now = datetime.now(JST)

          date_path = now.strftime("%Y/%m/%d")
          date_value = now.strftime("%Y-%m-%d")


          # ==================================================
          # 場コード
          # ==================================================

          venues = {
              "桐生": "01",
              "戸田": "02",
              "江戸川": "03",
              "平和島": "04",
              "多摩川": "05",
              "浜名湖": "06",
              "蒲郡": "07",
              "常滑": "08",
              "津": "09",
              "三国": "10",
              "びわこ": "11",
              "住之江": "12",
              "尼崎": "13",
              "鳴門": "14",
              "丸亀": "15",
              "児島": "16",
              "宮島": "17",
              "徳山": "18",
              "下関": "19",
              "若松": "20",
              "芦屋": "21",
              "福岡": "22",
              "唐津": "23",
              "大村": "24"
          }


          # ==================================================
          # CSV
          # ==================================================

          sources = {
              "tkz": "exhibition_time",
              "stt": "start_exhibition",
              "sui": "weather",
              "od3": "odds_3tan",
          }


          # ==================================================
          # 入力
          # ==================================================

          venue = os.environ.get(
              "VENUE",
              ""
          ).strip()

          race_no = os.environ.get(
              "RACE_NO",
              ""
          ).strip()


          venue_code = venues.get(
              venue
          )


          if venue_code is None:

              raise SystemExit(
                  "場名が認識できません: "
                  + venue
              )


          try:

              race_number = int(
                  race_no
              )

              if not 1 <= race_number <= 12:

                  raise ValueError

          except ValueError:

              raise SystemExit(
                  "レース番号は1〜12で指定してください"
              )


          # ==================================================
          # 期待するレースコード
          # ==================================================

          target_code = (

              date_value.replace(
                  "-",
                  ""
              )

              + venue_code

              + f"{race_number:02d}"

          )


          # ==================================================
          # 開始
          # ==================================================

          print("================================")
          print("BOAT RACE CSV 診断")
          print("================================")

          print(
              "取得時刻:",
              now.isoformat()
          )

          print(
              "開催日:",
              date_value
          )

          print(
              "指定場:",
              venue
          )

          print(
              "場コード:",
              venue_code
          )

          print(
              "指定R:",
              race_number
          )

          print(
              "期待するレースコード:",
              target_code
          )

          print("================================")


          # ==================================================
          # 全CSVを確認
          # ==================================================

          all_race_codes = set()


          for source, name in sources.items():

              url = (

                  "https://boatracecsv.github.io/data/previews/"

                  + source

                  + "/"

                  + date_path

                  + ".csv"

              )


              print("")
              print(
                  "-----",
                  source,
                  name,
                  "-----"
              )

              print(
                  "URL:",
                  url
              )


              try:

                  with urllib.request.urlopen(
                      url,
                      timeout=30
                  ) as response:

                      text = response.read().decode(
                          "utf-8-sig"
                      )


                  rows = list(
                      csv.DictReader(
                          text.splitlines()
                      )
                  )


                  today_rows = []


                  for row in rows:

                      if (
                          row.get(
                              "レース日"
                          )
                          != date_value
                      ):

                          continue


                      code = (

                          row.get(
                              "レースコード"
                          )
                          or ""
                      ).strip()


                      if code:

                          today_rows.append(
                              code
                          )

                          all_race_codes.add(
                              code
                          )


                  unique_codes = sorted(
                      set(
                          today_rows
                      )
                  )


                  print(
                      "全CSV行数:",
                      len(rows)
                  )

                  print(
                      "当日行数:",
                      len(today_rows)
                  )

                  print(
                      "当日のユニークレース数:",
                      len(unique_codes)
                  )


                  print(
                      "当日のレースコード:"
                  )


                  for code in unique_codes:

                      print(
                          " ",
                          code
                      )


                  print(
                      "指定レース存在:",
                      target_code
                      in set(unique_codes)
                  )


              except Exception as e:

                  print(
                      "取得失敗:",
                      e
                  )


          # ==================================================
          # 統合結果
          # ==================================================

          print("")
          print("================================")
          print("全CSV統合結果")
          print("================================")

          print(
              "統合ユニークレース数:",
              len(all_race_codes)
          )

          print(
              "指定レース存在:",
              target_code
              in all_race_codes
          )


          if target_code not in all_race_codes:

              print(
                  "原因候補: "
                  "CSV側に期待するレースコードが存在していません"
              )

              print(
                  "公式オッズ取得は今回の診断では実行しません"
              )

          else:

              print(
                  "CSV上では指定レースが存在します"
              )

              print(
                  "次はレースコード照合処理を確認します"
              )


          print("================================")

          PY