name: BOAT RACE Bridge

on:
  workflow_dispatch:
    inputs:
      venue:
        description: "場名"
        required: true
        default: "唐津"

      race_no:
        description: "レース番号"
        required: true
        default: "4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # GitHubリポジトリ取得
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # データ取得・JSON生成
      # ========================================

      - name: データ取得・JSON生成
        env:
          VENUE: ${{ github.event.inputs.venue }}
          RACE_NO: ${{ github.event.inputs.race_no }}

        run: |

          python - <<'PY'

          import csv
          import json
          import os
          import urllib.request

          from datetime import datetime, timezone, timedelta
          from pathlib import Path


          # ========================================
          # 日本時間
          # ========================================

          JST = timezone(timedelta(hours=9))

          now = datetime.now(JST)

          date_path = now.strftime("%Y/%m/%d")
          date_value = now.strftime("%Y-%m-%d")


          # ========================================
          # 場コード
          # ========================================

          venues = {
              "桐生": "01",
              "戸田": "02",
              "江戸川": "03",
              "平和島": "04",
              "多摩川": "05",
              "浜名湖": "06",
              "蒲郡": "07",
              "常滑": "08",
              "津": "09",
              "三国": "10",
              "びわこ": "11",
              "住之江": "12",
              "尼崎": "13",
              "鳴門": "14",
              "丸亀": "15",
              "児島": "16",
              "宮島": "17",
              "徳山": "18",
              "下関": "19",
              "若松": "20",
              "芦屋": "21",
              "福岡": "22",
              "唐津": "23",
              "大村": "24"
          }


          # ========================================
          # 入力
          # ========================================

          venue = os.environ["VENUE"].strip()

          race_no = os.environ["RACE_NO"].strip()


          if venue not in venues:

              raise SystemExit(
                  "場名が認識できません: "
                  + venue
              )


          try:

              race_number = int(race_no)

          except ValueError:

              raise SystemExit(
                  "レース番号が不正です"
              )


          if not 1 <= race_number <= 12:

              raise SystemExit(
                  "レース番号は1〜12で指定してください"
              )


          venue_code = venues[venue]


          target_code = (
              date_value.replace("-", "")
              + venue_code
              + f"{race_number:02d}"
          )


          print("========================================")
          print("BOAT RACE BRIDGE")
          print("========================================")

          print(
              "取得時刻:",
              now.isoformat()
          )

          print(
              "開催日:",
              date_value
          )

          print(
              "場:",
              venue
          )

          print(
              "場コード:",
              venue_code
          )

          print(
              "R:",
              race_number
          )

          print(
              "レースコード:",
              target_code
          )

          print("========================================")


          # ========================================
          # 基本JSON
          # ========================================

          result = {

              "generated_at":
                  now.isoformat(),

              "race": {

                  "date":
                      date_value,

                  "venue":
                      venue,

                  "venue_code":
                      venue_code,

                  "race_no":
                      race_number,

                  "race_code":
                      target_code
              },

              "sources": {},

              "summary": {}
          }


          # ========================================
          # CSV取得関数
          # ========================================

          def get_row(source):

              url = (
                  "https://boatracecsv.github.io/data/previews/"
                  + source
                  + "/"
                  + date_path
                  + ".csv"
              )


              print("")
              print("取得:", source)
              print("URL:", url)


              try:

                  # ----------------------------------------
                  # CSV取得
                  # ----------------------------------------

                  with urllib.request.urlopen(
                      url,
                      timeout=30
                  ) as response:

                      text = response.read().decode(
                          "utf-8-sig"
                      )


                  # ----------------------------------------
                  # CSV解析
                  # ----------------------------------------

                  reader = csv.DictReader(
                      text.splitlines()
                  )

                  rows = list(reader)


                  print(
                      source,
                      "CSV行数:",
                      len(rows)
                  )


                  print(
                      source,
                      "検索対象レースコード:",
                      repr(target_code)
                  )


                  # ----------------------------------------
                  # CSVヘッダー確認
                  # ----------------------------------------

                  if reader.fieldnames:

                      print(
                          source,
                          "CSVヘッダー確認:"
                      )

                      print(
                          reader.fieldnames
                      )


                  # ----------------------------------------
                  # CSV内のレースコード診断
                  # ----------------------------------------

                  race_codes = []


                  for row in rows:

                      code = (
                          row.get("レースコード")
                          or ""
                      ).strip()


                      if code:

                          race_codes.append(
                              code
                          )


                  print(
                      source,
                      "CSV内レースコード一覧:"
                  )


                  for code in race_codes:

                      print(
                          "  ",
                          repr(code)
                      )


                  # ----------------------------------------
                  # 対象レース検索
                  # ----------------------------------------

                  for row in rows:

                      code = (
                          row.get("レースコード")
                          or ""
                      ).strip()


                      if code == target_code:

                          print(
                              source,
                              "取得成功"
                          )

                          return (
                              row,
                              len(rows),
                              None
                          )


                  print(
                      source,
                      "対象レースなし"
                  )


                  return (
                      None,
                      len(rows),
                      None
                  )


              except Exception as e:

                  print(
                      source,
                      "取得エラー:",
                      repr(e)
                  )


                  return (
                      None,
                      0,
                      type(e).__name__
                      + ": "
                      + str(e)
                  )


          # ========================================
          # 展示タイム
          # ========================================

          row, total, error = get_row("tkz")


          tkz = {

              "available":
                  row is not None,

              "csv_rows":
                  total
          }


          if error:

              tkz["error"] = error


          if row:

              tkz["boats"] = {}


              for n in range(1, 7):

                  tkz["boats"][str(n)] = {

                      "weight":
                          row.get(
                              f"艇{n}_体重(kg)"
                          ),

                      "weight_adjust":
                          row.get(
                              f"艇{n}_体重調整(kg)"
                          ),

                      "exhibition_time":
                          row.get(
                              f"艇{n}_展示タイム"
                          ),

                      "tilt":
                          row.get(
                              f"艇{n}_チルト"
                          )
                  }


          result["sources"]["tkz"] = tkz


          # ========================================
          # スタート展示
          # ========================================

          row, total, error = get_row("stt")


          stt = {

              "available":
                  row is not None,

              "csv_rows":
                  total
          }


          if error:

              stt["error"] = error


          if row:

              stt["boats"] = {}


              for n in range(1, 7):

                  stt["boats"][str(n)] = {

                      "course":
                          row.get(
                              f"艇{n}_コース"
                          ),

                      "start_exhibition":
                          row.get(
                              f"艇{n}_スタート展示"
                          )
                  }


          result["sources"]["stt"] = stt


          # ========================================
          # 天候・水面
          # ========================================

          row, total, error = get_row("sui")


          sui = {

              "available":
                  row is not None,

              "csv_rows":
                  total
          }


          if error:

              sui["error"] = error


          if row:

              data = {}


              for key, value in row.items():

                  if key in (
                      "レースコード",
                      "レース日",
                      "レース場",
                      "レース回"
                  ):

                      continue


                  if (
                      value is not None
                      and str(value).strip() != ""
                  ):

                      data[key] = value


              sui["data"] = data


          result["sources"]["sui"] = sui


          # ========================================
          # 3連単オッズ
          # ========================================

          row, total, error = get_row("od3")


          od3 = {

              "available":
                  row is not None,

              "csv_rows":
                  total
          }


          if error:

              od3["error"] = error


          if row:

              data = {}


              for key, value in row.items():

                  if key in (
                      "レースコード",
                      "レース日",
                      "レース場",
                      "レース回"
                  ):

                      continue


                  if (
                      value is not None
                      and str(value).strip() != ""
                  ):

                      data[key] = value


              od3["data"] = data


          result["sources"]["od3"] = od3


          # ========================================
          # サマリー
          # ========================================

          summary = {

              "exhibition_time": {},

              "start_exhibition": {},

              "fastest_exhibition": None,

              "fastest_start": None
          }


          # ========================================
          # 展示タイム最速
          # ========================================

          if tkz.get("available"):

              times = []


              for boat, data in tkz["boats"].items():

                  value = data.get(
                      "exhibition_time"
                  )


                  summary[
                      "exhibition_time"
                  ][boat] = value


                  if value not in (
                      None,
                      "",
                      "-"
                  ):

                      try:

                          times.append(
                              (
                                  boat,
                                  float(value)
                              )
                          )

                      except ValueError:

                          pass


              if times:

                  times.sort(
                      key=lambda x: x[1]
                  )


                  summary[
                      "fastest_exhibition"
                  ] = {

                      "boat":
                          times[0][0],

                      "time":
                          times[0][1]
                  }


          # ========================================
          # ST展示最速
          # ========================================

          if stt.get("available"):

              starts = []


              for boat, data in stt["boats"].items():

                  value = data.get(
                      "start_exhibition"
                  )


                  summary[
                      "start_exhibition"
                  ][boat] = value


                  if value not in (
                      None,
                      "",
                      "-"
                  ):

                      try:

                          starts.append(
                              (
                                  boat,
                                  float(value)
                              )
                          )

                      except ValueError:

                          pass


              if starts:

                  starts.sort(
                      key=lambda x: x[1]
                  )


                  summary[
                      "fastest_start"
                  ] = {

                      "boat":
                          starts[0][0],

                      "start":
                          starts[0][1]
                  }


          result["summary"] = summary


          # ========================================
          # 取得状況
          # ========================================

          result["status"] = {

              "tkz":
                  tkz["available"],

              "stt":
                  stt["available"],

              "sui":
                  sui["available"],

              "od3":
                  od3["available"]
          }


          # ========================================
          # JSON保存
          # ========================================

          output_path = Path(
              "boat_race_context.json"
          )


          output_path.write_text(

              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"
          )


          print("")
          print("========================================")
          print("JSON保存完了")
          print("========================================")

          print(
              "ファイル:",
              output_path
          )

          print(
              "サイズ:",
              output_path.stat().st_size,
              "bytes"
          )

          print("========================================")


          PY


      # ========================================
      # GitHubへ保存
      # ========================================

      - name: JSONをGitHubへ保存
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add boat_race_context.json


          if git diff --cached --quiet; then

            echo "JSONに変更なし"

          else

            git commit \
              -m "Update boat race context"

            git push

          fi


      # ========================================
      # 保存確認
      # ========================================

      - name: 保存確認
        run: |

          echo "========================================"
          echo "BOAT RACE CONTEXT 保存確認"
          echo "========================================"


          ls -lh boat_race_context.json


          echo ""


          python - <<'PY'

          import json


          with open(
              "boat_race_context.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print(
              "開催日:",
              data["race"]["date"]
          )


          print(
              "場:",
              data["race"]["venue"]
          )


          print(
              "R:",
              data["race"]["race_no"]
          )


          print(
              "レースコード:",
              data["race"]["race_code"]
          )


          print("")


          print(
              "展示タイム:",
              data["status"]["tkz"]
          )


          print(
              "スタート展示:",
              data["status"]["stt"]
          )


          print(
              "天候・水面:",
              data["status"]["sui"]
          )


          print(
              "3連単オッズ:",
              data["status"]["od3"]
          )


          print("")


          print(
              "JSON確認: OK"
          )


          PY