name: Official Odds Test

on:
  workflow_dispatch:
    inputs:
      venue_code:
        description: "場コード（蒲郡=07）"
        required: true
        default: "07"
      race_no:
        description: "レース番号"
        required: true
        default: "7"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get official BOAT RACE odds
        env:
          VENUE_CODE: ${{ github.event.inputs.venue_code }}
          RACE_NO: ${{ github.event.inputs.race_no }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          venue = os.environ["VENUE_CODE"]
          race_no = int(os.environ["RACE_NO"])

          date_value = now.strftime("%Y%m%d")

          url = (
              "https://www.boatrace.jp/owsp/sp/race/odds3t"
              f"?hd={date_value}&jcd={venue}&rno={race_no}"
          )

          print("URL:", url)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 "
                      "(KHTML, like Gecko) Version/18.0 "
                      "Mobile/15E148 Safari/604.1"
                  )
              }
          )

          result = {
              "generated_at": now.isoformat(),
              "url": url,
              "venue_code": venue,
              "race_no": race_no,
              "downloaded": False,
              "html_length": 0,
              "odds_table_found": False,
              "odds_count": 0,
              "odds": {},
              "sample": {},
              "error": None
          }

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", errors="replace")

              result["downloaded"] = True
              result["html_length"] = len(html)

              print("HTML取得成功")
              print("HTML文字数:", len(html))

              if 'id="content_odds"' in html:
                  result["odds_table_found"] = True
                  print("オッズエリアを検出しました")
              else:
                  print("オッズエリアを検出できませんでした")

              # odds3t123 ～ odds3t654 のようなIDを直接取得
              pattern = re.compile(
                  r'id=["\']odds3t([1-6]{3})["\'][^>]*>([^<]+)<'
              )

              matches = pattern.findall(html)

              odds = {}

              for combination, value in matches:
                  combination = combination.strip()
                  value = value.strip()

                  # 3連単として成立する組み合わせだけを採用
                  if len(combination) != 3:
                      continue

                  if len(set(combination)) != 3:
                      continue

                  try:
                      odds[combination] = float(value)
                  except ValueError:
                      continue

              result["odds"] = dict(
                  sorted(odds.items())
              )

              result["odds_count"] = len(odds)

              # サンプル
              sample_keys = [
                  "123",
                  "124",
                  "125",
                  "126",
                  "132",
                  "134",
                  "135",
                  "136",
                  "213",
                  "214"
              ]

              result["sample"] = {
                  key: odds[key]
                  for key in sample_keys
                  if key in odds
              }

              print("================================")
              print("Official BOAT RACE Odds Test")
              print("取得時刻:", now.isoformat())
              print("場コード:", venue)
              print("レース:", race_no)
              print("取得成功:", result["downloaded"])
              print("オッズエリア:", result["odds_table_found"])
              print("取得したオッズ数:", result["odds_count"])
              print("サンプル:", result["sample"])
              print("================================")

              # 120通り取得できなければテスト失敗
              if result["odds_count"] != 120:
                  raise RuntimeError(
                      f"3連単オッズを120通り取得できませんでした: "
                      f"{result['odds_count']}通り"
                  )

          except Exception as e:
              result["error"] = str(e)
              print("取得エラー:", e)

          Path("official_odds_test.json").write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # 取得エラーの場合はActionsを赤にする
          if result["error"] is not None:
              raise SystemExit(1)

          PY

      - name: Save test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- official_odds_test.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Test mobile official BOAT RACE odds parser"
            git push
          fi