name: Official Odds Test

on:
  workflow_dispatch:
    inputs:
      venue_code:
        description: "場コード（蒲郡=07）"
        required: true
        default: "07"

      race_no:
        description: "レース番号"
        required: true
        default: "7"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get official BOAT RACE odds
        env:
          VENUE_CODE: ${{ github.event.inputs.venue_code }}
          RACE_NO: ${{ github.event.inputs.race_no }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          # ==============================
          # 日本時間
          # ==============================

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          venue = os.environ["VENUE_CODE"]
          race_no = int(os.environ["RACE_NO"])

          date_value = now.strftime("%Y%m%d")

          # ==============================
          # 公式BOAT RACE オッズページ
          # ==============================

          url = (
              "https://www.boatrace.jp/owsp/sp/race/odds3t"
              f"?hd={date_value}&jcd={venue}&rno={race_no}"
          )

          print("================================")
          print("Official BOAT RACE Odds Test")
          print("URL:", url)
          print("================================")

          # ==============================
          # User-Agent
          # ==============================

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 "
                      "(KHTML, like Gecko) Version/18.0 "
                      "Mobile/15E148 Safari/604.1"
                  )
              }
          )

          # ==============================
          # 結果
          # ==============================

          result = {
              "generated_at": now.isoformat(),
              "url": url,
              "venue_code": venue,
              "race_no": race_no,
              "downloaded": False,
              "html_length": 0,
              "odds_table_found": False,
              "odds_point_count": 0,
              "numeric_odds_count": 0,
              "sample": {},
              "error": None
          }

          try:

              # ==============================
              # HTML取得
              # ==============================

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              result["downloaded"] = True
              result["html_length"] = len(html)

              print("HTML取得成功")
              print("HTML文字数:", len(html))

              # ==============================
              # オッズエリア確認
              # ==============================

              if 'id="content_odds"' in html:

                  result["odds_table_found"] = True

                  print("オッズエリア: OK")

              else:

                  print("オッズエリア: 見つかりません")

              # ==============================
              # oddsPoint を取得
              #
              # 例:
              #
              # <td class="oddsPoint">16.1</td>
              #
              # ==============================

              pattern = re.compile(
                  r'<td[^>]*class=["\'][^"\']*oddsPoint[^"\']*["\'][^>]*>'
                  r'\s*([^<]+?)\s*'
                  r'</td>',
                  re.IGNORECASE
              )

              matches = pattern.findall(html)

              result["odds_point_count"] = len(matches)

              print("oddsPoint個数:", len(matches))

              # ==============================
              # 数字だけ取り出す
              # ==============================

              odds_values = []

              for value in matches:

                  value = value.strip()

                  # カンマ除去
                  value = value.replace(",", "")

                  # 数値の場合だけ採用
                  try:

                      number = float(value)
                      odds_values.append(number)

                  except ValueError:

                      pass

              result["numeric_odds_count"] = len(odds_values)

              print(
                  "数値として取得できたオッズ数:",
                  len(odds_values)
              )

              # ==============================
              # 最初の20件を確認用に保存
              # ==============================

              result["sample"] = {
                  str(index + 1): value
                  for index, value in enumerate(
                      odds_values[:20]
                  )
              }

              print("--------------------------------")
              print("サンプル:")
              print(
                  json.dumps(
                      result["sample"],
                      ensure_ascii=False,
                      indent=2
                  )
              )
              print("--------------------------------")

              # ==============================
              # テスト判定
              #
              # 3連単は
              #
              # 6 × 5 × 4 = 120通り
              #
              # ==============================

              if len(odds_values) != 120:

                  raise RuntimeError(
                      "3連単オッズを120個取得できませんでした: "
                      f"{len(odds_values)}個"
                  )

              print("")
              print("================================")
              print("テスト成功")
              print("3連単オッズ 120個を取得しました")
              print("================================")

          except Exception as e:

              result["error"] = str(e)

              print("")
              print("================================")
              print("テスト失敗")
              print("エラー:", e)
              print("================================")

          # ==============================
          # JSON保存
          # ==============================

          Path(
              "official_odds_test.json"
          ).write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ==============================
          # エラーならActionsを赤にする
          # ==============================

          if result["error"] is not None:

              raise SystemExit(1)

          PY

      - name: Save test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- official_odds_test.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Test official BOAT RACE odds extraction"
            git push
          fi