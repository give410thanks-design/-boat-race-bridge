name: Official Odds HTML Debug Test

on:
  workflow_dispatch:
    inputs:
      venue_code:
        description: "場コード（蒲郡=07）"
        required: true
        default: "07"
      race_no:
        description: "レース番号"
        required: true
        default: "7"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get official BOAT RACE odds HTML
        env:
          VENUE_CODE: ${{ github.event.inputs.venue_code }}
          RACE_NO: ${{ github.event.inputs.race_no }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          venue = os.environ["VENUE_CODE"]
          race_no = int(os.environ["RACE_NO"])

          date_value = now.strftime("%Y%m%d")

          url = (
              "https://www.boatrace.jp/owsp/sp/race/odds3t"
              f"?hd={date_value}&jcd={venue}&rno={race_no}"
          )

          print("================================")
          print("Official BOAT RACE HTML Debug Test")
          print("URL:", url)
          print("================================")

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 "
                      "(KHTML, like Gecko) Version/18.0 "
                      "Mobile/15E148 Safari/604.1"
                  )
              }
          )

          result = {
              "generated_at": now.isoformat(),
              "url": url,
              "venue_code": venue,
              "race_no": race_no,
              "downloaded": False,
              "html_length": 0,
              "odds_table_found": False,
              "odds3t_count": 0,
              "odds3t123_count": 0,
              "point_count": 0,
              "odds_count": 0,
              "sample": {},
              "error": None
          }

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              result["downloaded"] = True
              result["html_length"] = len(html)

              print("")
              print("HTML取得成功")
              print("HTML文字数:", len(html))

              # ==========================================
              # GitHub Actionsが取得したHTMLをそのまま保存
              # ==========================================

              Path("debug_odds.html").write_text(
                  html,
                  encoding="utf-8"
              )

              print("debug_odds.html を作成しました")

              # ==========================================
              # HTMLの中身を調査
              # ==========================================

              odds3t_count = html.count("odds3t")
              odds3t123_count = html.count("odds3t123")
              point_count = html.count('class="point"')
              content_odds_count = html.count(
                  'id="content_odds"'
              )

              result["odds3t_count"] = odds3t_count
              result["odds3t123_count"] = odds3t123_count
              result["point_count"] = point_count

              if content_odds_count > 0:
                  result["odds_table_found"] = True

              print("")
              print("================================")
              print("HTML構造チェック")
              print("================================")
              print("content_odds:", content_odds_count)
              print("odds3t:", odds3t_count)
              print("odds3t123:", odds3t123_count)
              print('class="point":', point_count)
              print("================================")

              # ==========================================
              # 現在の正規表現でも試しに取得
              # ==========================================

              pattern = re.compile(
                  r'id=["\']odds3t([1-6]{3})["\'][^>]*>([^<]+)<'
              )

              matches = pattern.findall(html)

              odds = {}

              for combination, value in matches:
                  combination = combination.strip()
                  value = value.strip()

                  if len(combination) != 3:
                      continue

                  if len(set(combination)) != 3:
                      continue

                  try:
                      odds[combination] = float(value)
                  except ValueError:
                      continue

              result["odds_count"] = len(odds)

              sample_keys = [
                  "123",
                  "124",
                  "125",
                  "126",
                  "132",
                  "134",
                  "135",
                  "136",
                  "213",
                  "214"
              ]

              result["sample"] = {
                  key: odds[key]
                  for key in sample_keys
                  if key in odds
              }

              print("")
              print("================================")
              print("現在のオッズ取得方式")
              print("================================")
              print("取得したオッズ数:", len(odds))
              print("サンプル:", result["sample"])
              print("================================")

          except Exception as e:
              result["error"] = str(e)

              print("")
              print("取得エラー:", e)

              raise

          Path("official_odds_debug.json").write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("official_odds_debug.json を作成しました")
          print("")
          print("今回は120通り取得できなくても")
          print("テストを失敗にはしません。")
          print("HTMLそのものを調査するためのテストです。")

          PY

      # ==========================================
      # 取得したHTMLとJSONを保存
      # ==========================================

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: official-odds-debug
          path: |
            debug_odds.html
            official_odds_debug.json

      # ==========================================
      # JSONだけGitHubに保存
      # ==========================================

      - name: Save debug result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- official_odds_debug.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Debug official BOAT RACE odds HTML"
            git push
          fi