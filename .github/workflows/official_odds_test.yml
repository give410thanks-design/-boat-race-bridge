name: Official Odds Test

on:
  workflow_dispatch:
    inputs:
      venue_code:
        description: "場コード（蒲郡=07）"
        required: true
        default: "07"
      race_no:
        description: "レース番号"
        required: true
        default: "7"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4

      - name: Get official BOAT RACE odds HTML structure
        env:
          VENUE_CODE: ${{ github.event.inputs.venue_code }}
          RACE_NO: ${{ github.event.inputs.race_no }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          from bs4 import BeautifulSoup

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          venue = os.environ["VENUE_CODE"]
          race_no = int(os.environ["RACE_NO"])
          date_value = now.strftime("%Y%m%d")

          url = (
              "https://boatrace.jp/owpc/pc/race/odds3t"
              f"?hd={date_value}&jcd={venue}&rno={race_no}"
          )

          print("URL:", url)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "Chrome/131.0 Safari/537.36"
                  )
              }
          )

          result = {
              "generated_at": now.isoformat(),
              "url": url,
              "venue_code": venue,
              "race_no": race_no,
              "downloaded": False,
              "html_length": 0,
              "odds_table_found": False,
              "table_count": 0,
              "target_table_html_length": 0,
              "target_table_text": "",
              "error": None
          }

          try:
              # --------------------------------
              # 1. 公式HTML取得
              # --------------------------------
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", errors="replace")

              result["downloaded"] = True
              result["html_length"] = len(html)

              print("HTML取得成功")
              print("HTML文字数:", len(html))

              # --------------------------------
              # 2. HTML解析
              # --------------------------------
              soup = BeautifulSoup(html, "html.parser")

              tables = soup.find_all("table")
              result["table_count"] = len(tables)

              print("table総数:", len(tables))

              target_table = None

              # 「3連単オッズ」を含むtableを探す
              for index, table in enumerate(tables):
                  text = table.get_text(" ", strip=True)

                  if "3連単オッズ" in text:
                      target_table = table

                      print("3連単オッズ表を発見")
                      print("table番号:", index)

                      break

              # --------------------------------
              # 3. 対象tableを保存
              # --------------------------------
              if target_table is not None:

                  result["odds_table_found"] = True

                  table_html = str(target_table)
                  table_text = target_table.get_text(
                      " | ",
                      strip=True
                  )

                  result["target_table_html_length"] = len(table_html)
                  result["target_table_text"] = table_text

                  Path(
                      "official_odds_table.html"
                  ).write_text(
                      table_html,
                      encoding="utf-8"
                  )

                  Path(
                      "official_odds_table.txt"
                  ).write_text(
                      table_text,
                      encoding="utf-8"
                  )

                  print(
                      "対象table HTML文字数:",
                      len(table_html)
                  )

                  print("================================")
                  print("対象tableのテキスト")
                  print("================================")
                  print(table_text[:10000])

              else:
                  print(
                      "3連単オッズ表を含むtableが"
                      "見つかりませんでした"
                  )

          except Exception as e:

              result["error"] = str(e)

              print("エラー:", e)

          # --------------------------------
          # 4. JSON保存
          # --------------------------------
          Path(
              "official_odds_test.json"
          ).write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("================================")
          print("Official BOAT RACE HTML Structure Test")
          print("取得時刻:", now.isoformat())
          print("場コード:", venue)
          print("レース:", race_no)
          print("取得成功:", result["downloaded"])
          print("HTML文字数:", result["html_length"])
          print("table総数:", result["table_count"])
          print("オッズ表:", result["odds_table_found"])
          print(
              "対象table HTML文字数:",
              result["target_table_html_length"]
          )
          print("エラー:", result["error"])
          print("================================")
          PY

      - name: Save test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add official_odds_test.json
          git add official_odds_table.html
          git add official_odds_table.txt

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Inspect official BOAT RACE odds HTML structure"
            git push
          fi